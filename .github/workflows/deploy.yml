name: Deploy

# Redeploys api/worker/crawl-worker/crawl-dispatcher/browser-scaler/
# saved-search-alerts/follow-up-reminders/retry-failed-scans/
# generate-static-job-pages with the new image/source on every push to
# main. worker and crawl-worker are Cloud Functions (2nd gen, Pub/Sub-
# triggered) redeployed from source, same as crawl-dispatcher,
# browser-scaler, saved-search-alerts, follow-up-reminders,
# retry-failed-scans, and generate-static-job-pages (HTTP-triggered,
# Scheduler-invoked) — not from the built image below.
# One-time setup (API enablement,
# Cloud SQL instance, secrets, IAM bindings, Scheduler jobs, the functions'
# Pub/Sub triggers) lives in deploy/gcloud-deploy.sh and is NOT part of this
# workflow — see that script's comments before changing infra, not just code.
#
# Job graph: test -> build (image + migrations) -> the nine deploy-*
# jobs, which all depend only on build and nothing else, so GitHub Actions
# runs them concurrently instead of one long serial chain. Each deploy-*
# job re-authenticates on its own fresh runner (no state carries over
# between jobs) — image_tag is the one thing api's job needs from build,
# passed via job outputs since env vars set in one job aren't visible in
# another.

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  PROJECT_ID: yabotjobs
  REGION: us-central1
  SQL_REGION: us-east1
  REPO: yabot-jobs

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Settings has a handful of required-with-no-default fields (real
      # secrets in prod) that just need to be *present* for Settings() to
      # construct at import time — nothing here is used for real encryption
      # or cloud calls, the whole suite runs against in-memory SQLite and
      # mocks (see tests/conftest.py, tests/services/conftest.py).
      API_KEY_ENCRYPTION_KEY: "ci-placeholder-not-used-for-real-encryption-AAAA="
      GCP_PROJECT_ID: "ci-test"
      RESUME_STORAGE_ACCESS_KEY_ID: "ci-test"
      RESUME_STORAGE_SECRET_ACCESS_KEY: "ci-test"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements-dev.txt
      # `python -m pytest`, not bare `pytest`: -m prepends the cwd (repo
      # root, where app/ lives) to sys.path, which is what makes `app.*`
      # importable in every test module and conftest.py. The bare `pytest`
      # console script doesn't do that — it collects fine locally only
      # because whatever installed this repo's venv already put it on
      # sys.path some other way; a clean CI checkout has nothing to rely on.
      - run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/487584214286/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@yabotjobs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      - id: image_tag
        name: Set image tag
        run: echo "image_tag=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/backend:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Native docker build/push instead of `gcloud builds submit`: Cloud
      # Build's client-side source upload to the auto-created
      # ${PROJECT_ID}_cloudbuild staging bucket kept failing for the
      # WIF-impersonated service account ("forbidden from accessing the
      # bucket") even after granting cloudbuild.builds.editor,
      # serviceusage.serviceUsageConsumer, and bucket-level
      # storage.objectAdmin — the same failure a human owner also hits
      # locally unless their ADC quota project is set, which doesn't apply
      # to WIF-issued tokens. Building directly on the runner sidesteps that
      # staging bucket entirely and only needs artifactregistry.writer.
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push image
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.image_tag }}
        run: |
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      # Runs here, before any deploy-* job starts, so every service/function
      # that comes up in parallel below sees a schema they're all compatible
      # with — none of them wait on each other, only on this.
      - name: Run database migrations
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.image_tag }}
        run: |
          gcloud run jobs deploy migrate --image="$IMAGE_TAG" --region="$REGION" --project="$PROJECT_ID" --labels=function=migrate
          gcloud run jobs execute migrate --region="$REGION" --project="$PROJECT_ID" --wait

  deploy-api:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/487584214286/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@yabotjobs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      - name: Deploy api
        run: gcloud run deploy api --image="${{ needs.build.outputs.image_tag }}" --region="$REGION" --project="$PROJECT_ID" --update-labels=function=api

  # Cloud Functions redeploy from source, not the container image built
  # above — each of these seven jobs checks out the repo itself and only
  # needs `build` to have finished (migrations done), not its image.
  # crawl-dispatcher used to be one of these too, but is a Cloud Run Job now
  # (see its own job below) and deploys from the image like api/migrate.

  deploy-worker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/487584214286/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@yabotjobs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      # GOOGLE_FUNCTION_SOURCE is required because this repo's own main.py
      # is the FastAPI app, not the worker entry points.
      #
      # Instance caps (worker 30, crawl-worker 10): every instance holds a
      # Cloud SQL connection and the database (db-custom-1-3840) has ~100.
      # At the old hand-set 55/35, every twice-daily crawl burst (1pm/9pm
      # ET, crawl_dispatcher.py) hit the ceiling; 30 + 10 is ~50 connections
      # at full burst. --max-instances caps each *revision*, and a deploy
      # briefly runs two (the old one draining in-flight requests, up to the
      # 540s timeout, while the new one scales up) — that overlap is how 55
      # reached 101-111 active instances. So avoid deploying during a burst
      # (~1-2:30pm and ~9-10:30pm ET): overlapping there is ~100 connections
      # again. The service-level --max (shared by every revision receiving
      # traffic) is re-applied after each deploy in case the functions
      # deploy drops it. See deploy/gcloud-deploy.sh §3 before raising either.
      - name: Deploy worker
        run: |
          gcloud functions deploy worker \
            --gen2 \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --runtime=python313 \
            --source=. \
            --entry-point=handle_scan_request \
            --set-build-env-vars=GOOGLE_FUNCTION_SOURCE=worker.py \
            --max-instances=30 \
            --update-labels=function=worker

      - name: Cap worker across revisions
        run: gcloud run services update worker --region="$REGION" --project="$PROJECT_ID" --max=30

  deploy-crawl-worker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/487584214286/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@yabotjobs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      - name: Deploy crawl-worker
        run: |
          gcloud functions deploy crawl-worker \
            --gen2 \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --runtime=python313 \
            --source=. \
            --entry-point=handle_crawl_request \
            --set-build-env-vars=GOOGLE_FUNCTION_SOURCE=crawl_worker.py \
            --max-instances=10 \
            --update-labels=function=crawl-worker

      - name: Cap crawl-worker across revisions
        run: gcloud run services update crawl-worker --region="$REGION" --project="$PROJECT_ID" --max=10

  deploy-crawl-dispatcher:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/487584214286/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@yabotjobs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      # crawl-dispatcher is a Cloud Run Job, not a Cloud Function, as of
      # 2026-09-28 — its dispatch loop over ~2,800+ sources routinely took
      # longer than Cloud Scheduler's attemptDeadline / a Function's own
      # request timeout, so it's now started fire-and-forget via the Run
      # Admin API instead of an HTTP call Scheduler waits on (see
      # deploy/gcloud-deploy.sh's crawl-dispatcher section for the full
      # story). Deploys from the already-built image, same as api above and
      # migrate in the build job — not from source, and only --image/
      # --labels need repeating here: command/args/timeout/retries/secrets/
      # env vars/Cloud SQL from that one-time setup carry forward untouched
      # on every redeploy that doesn't explicitly override them.
      - name: Deploy crawl-dispatcher
        run: gcloud run jobs deploy crawl-dispatcher --image="${{ needs.build.outputs.image_tag }}" --region="$REGION" --project="$PROJECT_ID" --labels=function=crawl-dispatcher

  deploy-saved-search-alerts:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/487584214286/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@yabotjobs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      # Same shape as crawl-dispatcher above — its own dispatch() entry point
      # in saved_search_alerts.py, not this repo's main.py.
      - name: Deploy saved-search-alerts
        run: |
          gcloud functions deploy saved-search-alerts \
            --gen2 \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --runtime=python313 \
            --source=. \
            --entry-point=dispatch \
            --set-build-env-vars=GOOGLE_FUNCTION_SOURCE=saved_search_alerts.py \
            --update-labels=function=saved-search-alerts

  deploy-follow-up-reminders:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/487584214286/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@yabotjobs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      # Same shape as saved-search-alerts above — its own dispatch() entry
      # point in follow_up_reminders.py, not this repo's main.py.
      - name: Deploy follow-up-reminders
        run: |
          gcloud functions deploy follow-up-reminders \
            --gen2 \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --runtime=python313 \
            --source=. \
            --entry-point=dispatch \
            --set-build-env-vars=GOOGLE_FUNCTION_SOURCE=follow_up_reminders.py \
            --update-labels=function=follow-up-reminders

  deploy-retry-failed-scans:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/487584214286/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@yabotjobs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      # Same shape as saved-search-alerts/follow-up-reminders above — its
      # own dispatch() entry point in retry_failed_scans.py, not this
      # repo's main.py. --trigger-http/--no-allow-unauthenticated are
      # spelled out here (the other functions' redeploy steps omit them
      # since gcloud preserves an existing function's trigger config on
      # redeploy) because this is that function's first-ever deploy —
      # `gcloud functions deploy` requires an explicit trigger when the
      # function doesn't exist yet, same config gcloud-deploy.sh's
      # one-time setup would otherwise have applied.
      - name: Deploy retry-failed-scans
        run: |
          gcloud functions deploy retry-failed-scans \
            --gen2 \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --runtime=python313 \
            --source=. \
            --entry-point=dispatch \
            --set-build-env-vars=GOOGLE_FUNCTION_SOURCE=retry_failed_scans.py \
            --trigger-http \
            --no-allow-unauthenticated \
            --update-labels=function=retry-failed-scans

  deploy-generate-static-job-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/487584214286/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@yabotjobs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      # Same shape as retry-failed-scans above — its own dispatch() entry
      # point in generate_static_job_pages.py, not this repo's main.py.
      # --trigger-http/--no-allow-unauthenticated spelled out here for the
      # same reason as retry-failed-scans: this is that function's
      # first-ever deploy, before deploy/gcloud-deploy.sh's one-time setup
      # has applied its trigger config.
      # --memory=2Gi/--cpu=1 pinned: each run loads the per-job page
      # manifest (~280k entries), an in-memory index of every live job for
      # related links, and plans ~8k company/location hubs. At 512Mi the
      # 2026-10-02 10pm run was killed before publishing 7,121 new pages;
      # 1Gi then held the plan but not rendering every hub at once (fixed in
      # static_hub_pages.publish_hubs). 2Gi is headroom over both.
      # --update-secrets adds the logo.dev key (company logos, see
      # app.services.logo_dev) on top of the secrets gcloud-deploy.sh set,
      # so it survives every redeploy; only this function calls logo.dev.
      - name: Deploy generate-static-job-pages
        run: |
          gcloud functions deploy generate-static-job-pages \
            --gen2 \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --runtime=python313 \
            --source=. \
            --entry-point=dispatch \
            --set-build-env-vars=GOOGLE_FUNCTION_SOURCE=generate_static_job_pages.py \
            --trigger-http \
            --no-allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --update-secrets=LOGO_DEV_SECRET_KEY=logo-dev-secret-key:latest \
            --update-labels=function=generate-static-job-pages

  deploy-browser-scaler:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/487584214286/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@yabotjobs.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: latest

      # Same shape as retry-failed-scans above — its own dispatch() entry
      # point in browser_scaler.py, not this repo's main.py.
      # --trigger-http/--no-allow-unauthenticated spelled out here for the
      # same reason as retry-failed-scans: this is that function's
      # first-ever deploy, before deploy/gcloud-deploy.sh's one-time setup
      # has applied its trigger config.
      #
      # Unlike retry-failed-scans/the others, --set-env-vars can't be
      # omitted here: this function never got a manual first deploy via
      # deploy/gcloud-deploy.sh's one-time setup (that command was blocked
      # in the session that wrote it), so CI's deploy is the *only* config
      # it's ever had — verified live 2026-09-28: without this, every
      # invocation crashed with KeyError: 'GCP_PROJECT_ID'
      # (app.services.gcp_admin reads it straight from the environment, see
      # that module's own docstring on why). GCP_PROJECT_ID alone, not the
      # full COMMON_ENV the database-touching functions use — browser_scaler.py
      # never touches the database or an LLM.
      #
      # --max-instances=1: a single Cloud Scheduler job (browser-scaler-tick)
      # is the only trigger, firing once every 2 minutes — this function
      # should never have more than one execution in flight, and the
      # gen2 default of 100 offered no benefit, only the (unlikely but
      # pointless) risk of two concurrent ticks racing on the same
      # min-instances decision.
      - name: Deploy browser-scaler
        run: |
          gcloud functions deploy browser-scaler \
            --gen2 \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --runtime=python313 \
            --source=. \
            --entry-point=dispatch \
            --set-build-env-vars=GOOGLE_FUNCTION_SOURCE=browser_scaler.py \
            --trigger-http \
            --no-allow-unauthenticated \
            --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID}" \
            --max-instances=1 \
            --update-labels=function=browser-scaler
